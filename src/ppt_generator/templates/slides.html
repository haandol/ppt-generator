<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;800&display=swap" rel="stylesheet"/>
    <title>Presentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            font-family: '맑은 고딕', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px 60px;
            gap: 28px;
        }
        .slide-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 1280px;
        }
        .slide-number {
            font-size: 14px;
            color: #606366;
            padding: 0 12px 6px;
            font-variant-numeric: tabular-nums;
        }
        section {
            position: relative;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
            flex-shrink: 0;
        }
        section > div[data-wrapper] {
            overflow: visible;
        }
        h1, h2, h3, h4 {
            line-height: 1.3;
        }
        p, ul, ol, li {
            margin: 0;
            line-height: 1.2;
        }
        img {
            display: block;
        }

        /* ── Layout ── */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }
        .two-col-wide {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 32px;
        }
        .three-col {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 24px;
        }

        /* ── Typography ── */
        .tag {
            display: inline-block;
            font-family: monospace;
            background-color: #1e3a5f;
            color: #f59e0b;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 14px;
        }
        .subtitle {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        .divider-bar {
            width: 64px;
            height: 4px;
            background-color: #f59e0b;
            border-radius: 9999px;
            margin-bottom: 24px;
        }

        /* ── Cards ── */
        .info-card {
            background-color: #162232;
            border-radius: 12px;
            padding: 24px;
        }
        .step-card {
            background-color: #161e2d;
            border-left: 4px solid #4B5563;
            padding: 20px;
            border-radius: 0 8px 8px 0;
        }
        .summary-card {
            background-color: #162232;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        /* ── Lists ── */
        .agenda-list {
            list-style: none;
            padding: 0;
        }
        .agenda-list li {
            padding: 12px 0;
            border-bottom: 1px solid #1e3a5f;
            font-size: 1.25rem;
            color: #ffffff;
        }
        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background-color: #162232;
            border-radius: 8px;
            padding: 16px;
        }

        /* ── Comparison ── */
        .vs-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 24px;
            align-items: start;
        }
        .vs-panel {
            background-color: #162232;
            border-radius: 12px;
            padding: 24px;
        }
        .vs-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #f59e0b;
        }

        /* ── Code ── */
        .code-block {
            border-radius: 12px;
            overflow: hidden;
        }
        .code-header {
            background-color: #1e3a5f;
            padding: 8px 16px;
            font-family: monospace;
            font-size: 14px;
            color: #94a3b8;
        }
        .code-body {
            background-color: #0a1628;
            padding: 16px;
            font-family: monospace;
            font-size: 16px;
            color: #e2e8f0;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        /* ── Diagrams ── */
        .arch-flow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .arch-stage {
            background-color: #162232;
            border-radius: 12px;
            padding: 16px 20px;
            text-align: center;
            color: #ffffff;
            font-size: 1rem;
        }
        .arch-arrow {
            font-size: 1.5rem;
            color: #f59e0b;
        }
        .pipeline-flow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .pipeline-stage {
            flex: 1;
            background-color: #162232;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            color: #ffffff;
            font-size: 1rem;
        }

        /* ── Quote ── */
        .quote-box {
            border-left: 4px solid #f59e0b;
            padding: 24px 32px;
            background-color: #162232;
            border-radius: 0 12px 12px 0;
            font-size: 1.25rem;
            font-style: italic;
            color: #e2e8f0;
        }

        /* ── Grids ── */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .info-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        /* ── CTA ── */
        .cta-box {
            background-color: #162232;
            border: 2px solid #f59e0b;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
        }

        /* ── Flow Diagram ── */
        .flow-diagram {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .flow-token {
            background-color: #1e3a5f;
            border: 1px solid #2d4a6f;
            border-radius: 6px;
            padding: 6px 14px;
            font-family: monospace;
            font-size: 14px;
            color: #7dd3fc;
        }
        .flow-arrow {
            font-size: 1.25rem;
            color: #f59e0b;
        }
        .flow-process {
            background-color: #f59e0b;
            color: #0f172a;
            border-radius: 6px;
            padding: 6px 14px;
            font-weight: 700;
            font-size: 14px;
        }
        .flow-result {
            background-color: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 6px;
            padding: 6px 14px;
            font-family: monospace;
            font-size: 14px;
            color: #4ade80;
        }

        /* ── Background Patterns ── */
        .tech-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }
        .tech-dots {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                radial-gradient(circle at 2px 2px, rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 30px 30px;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Slide Layout ── */
        .header-area {
            padding: 40px 60px 20px 60px;
            z-index: 10;
        }
        .content-area {
            flex: 1;
            display: flex;
            padding: 20px 60px 60px 60px;
            gap: 40px;
            z-index: 10;
            min-height: 0;
        }
        .slide-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .slide-subtitle {
            font-family: Consolas, 'Courier New', monospace;
            color: #9CA3AF;
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        /* ── Column Layout ── */
        .visual-col {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .steps-col {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }
        .text-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 0;
        }

        /* ── Step Header / Number ── */
        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .step-number {
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.9rem;
            color: #9CA3AF;
            font-weight: 700;
        }
        .step-card.active {
            border-left-color: #FF9900;
            background-color: #1f2a3d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .step-card.active .step-number {
            color: #FF9900;
        }

        /* ── Code Display (inline token flow) ── */
        .code-display {
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.9rem;
            color: #E5E7EB;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .arrow-icon {
            color: #6B7280;
            font-size: 0.8rem;
        }

        /* ── Pane Layout (left/right split) ── */
        .left-pane {
            flex: 0 0 35%;
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            position: relative;
        }
        .right-pane {
            flex: 1;
            padding: 80px 80px 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }

        /* ── Section Title (large impact) ── */
        .section-title {
            font-size: 4rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            letter-spacing: -1px;
            line-height: 1;
        }
        .section-subtitle {
            font-family: Consolas, 'Courier New', monospace;
            font-size: 1.2rem;
            color: #9CA3AF;
            margin-top: 1.5rem;
            line-height: 1.6;
        }

        /* ── Agenda Item ── */
        .agenda-item {
            display: flex;
            align-items: baseline;
            color: #E5E7EB;
            font-size: 1.6rem;
            font-weight: 500;
        }
        .item-number {
            font-family: Consolas, 'Courier New', monospace;
            color: #FF9900;
            font-weight: 700;
            margin-right: 1.5rem;
            font-size: 1.2rem;
            min-width: 2rem;
            text-align: right;
        }

        /* ── Accent / Eyebrow ── */
        .accent-bar {
            width: 60px;
            height: 6px;
            background-color: #FF9900;
            margin-bottom: 1rem;
        }
        .accent-eyebrow {
            font-family: Consolas, 'Courier New', monospace;
            color: #FF9900;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        /* ── Diagram Frame ── */
        .diagram-frame {
            background-color: #0f141e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .diagram-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .frame-label {
            position: absolute;
            top: 15px; left: 15px;
            background: rgba(0,0,0,0.7);
            color: #FF9900;
            padding: 4px 10px;
            border-radius: 4px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* ── Token Box (for code/data display) ── */
        .token-box {
            display: inline-block;
            background-color: rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.9rem;
            color: #E5E7EB;
        }
        .token-box.json {
            color: #a5b4fc;
            border-color: #6366f1;
            background-color: rgba(99,102,241,0.1);
        }
        .token-box.highlight {
            background-color: rgba(255,153,0,0.2);
            border-color: rgba(255,153,0,0.5);
            color: #FF9900;
            font-weight: 700;
        }

        /* ── Tech Label (floating badge) ── */
        .tech-label {
            position: absolute;
            background: rgba(255,153,0,0.1);
            border: 1px solid #FF9900;
            color: #FF9900;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.75rem;
            pointer-events: none;
        }

        /* ── Slide Footer ── */
        .slide-footer {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.8rem;
            color: #6B7280;
            z-index: 20;
        }

        /* ── Concept List ── */
        .concept-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .concept-item {
            display: flex;
            align-items: flex-start;
        }
        .concept-icon {
            color: #FF9900;
            font-size: 1.2rem;
            margin-top: 0.2rem;
            margin-right: 1rem;
            flex-shrink: 0;
        }
        .concept-header {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .concept-desc {
            color: #D1D5DB;
            font-size: 1rem;
            line-height: 1.5;
            font-weight: 300;
        }
    </style>
</head>
<body>
{slides_content}
<script>
(function() {
    var sections = document.querySelectorAll('body > section');
    var total = sections.length;
    sections.forEach(function(section, i) {
        var wrapper = document.createElement('div');
        wrapper.className = 'slide-wrapper';
        var label = document.createElement('div');
        label.className = 'slide-number';
        label.textContent = (i + 1) + ' / ' + total;
        section.parentNode.insertBefore(wrapper, section);
        wrapper.appendChild(label);
        wrapper.appendChild(section);
    });
})();
</script>
</body>
</html>
