[project]
name = "ppt-generator"
version = "0.8.2"
description = "자동 프레젠테이션 생성 MCP 서버 (LLM 생성은 클라이언트로 오프로딩)"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.28.1",
    "python-dotenv",
    "python-pptx>=1.0.2",
    "pydantic>=2",
]

[project.scripts]
ppt-generator = "ppt_generator.server:main"

[dependency-groups]
build = [
    "hatchling==1.33.0",
]
dev = [
    "pytest",
    "pytest-xdist>=3.8.0",
    "ruff",
]
visual-qa = [
    "playwright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/ppt_generator",
    "skills",
    "scripts",
    "tests",
    "docs/adr",
    "docs/harness",
    ".claude-plugin",
    ".github",
    ".kiro",
    ".python-version",
    ".uv-version",
    ".gitignore",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "README.md",
    "pyproject.toml",
    "uv.lock",
]
