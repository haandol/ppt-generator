[project]
name = "ppt-generator"
version = "0.7.1"
description = "자동 프레젠테이션 생성 MCP 서버 (LLM 생성은 클라이언트로 오프로딩)"
requires-python = ">=3.13"
dependencies = [
    "mcp",
    "playwright",
    "python-dotenv",
    "python-pptx>=1.0.2",
    "pydantic>=2",
]

[project.scripts]
ppt-generator = "ppt_generator.server:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
